<!-- ================= Онлайн-чат ================= -->
<div class="fixed bottom-5 right-5 z-[60] flex flex-col items-end gap-3 lg:bottom-7 lg:right-7">
  <!-- Панель чату -->
  <section
    class="pointer-events-none invisible w-[min(384px,calc(100vw-2.5rem))] translate-y-4 scale-95 overflow-hidden rounded-3xl bg-white opacity-0 shadow-xl ring-1 ring-ink-200 transition-all duration-350 ease-[cubic-bezier(0.16,1,0.3,1)]"
    data-chat-panel
    aria-label="Онлайн-консультант"
    aria-hidden="true"
  >
    <!-- Шапка -->
    <header class="relative overflow-hidden bg-gradient-to-br from-brand-600 to-brand-800 px-5 py-4 text-white">
      <div class="pointer-events-none absolute -right-8 -top-10 h-32 w-32 rounded-full bg-white/10 blur-2xl"></div>
      <div class="relative flex items-center gap-3">
        <span class="relative grid h-11 w-11 shrink-0 place-items-center rounded-full bg-white/15 ring-1 ring-white/25">
          <svg viewBox="0 0 24 24" class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
            <circle cx="12" cy="8.5" r="3.4" />
            <path d="M4.8 20a7.2 7.2 0 0 1 14.4 0" stroke-linecap="round" />
          </svg>
          <span class="absolute -bottom-0.5 -right-0.5 h-3.5 w-3.5 rounded-full bg-mint-500 ring-2 ring-brand-700"></span>
        </span>
        <div class="min-w-0 flex-1">
          <p class="text-[15px] font-semibold leading-tight">Анна · SOCO Ukraine</p>
          <p class="mt-0.5 flex items-center gap-1.5 text-xs text-brand-100">
            <span class="h-1.5 w-1.5 rounded-full bg-mint-500"></span>
            Онлайн · відповідаємо за ~2 хв
          </p>
        </div>
        <button type="button" class="grid h-9 w-9 place-items-center rounded-full transition-colors hover:bg-white/15" data-chat-close aria-label="Згорнути чат">
          <svg viewBox="0 0 24 24" class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M6 12h12" stroke-linecap="round" />
          </svg>
        </button>
      </div>
    </header>

    <!-- Стрічка повідомлень -->
    <div class="h-[330px] space-y-3 overflow-y-auto overscroll-contain bg-ink-50/60 px-4 py-4" data-chat-log role="log" aria-live="polite"></div>

    <!-- Швидкі відповіді -->
    <div class="flex gap-2 overflow-x-auto border-t border-ink-100 bg-white px-4 py-3 no-scrollbar" data-chat-quick>
      <button type="button" class="chip-suggest shrink-0" data-chat-preset="Підкажіть статус мого замовлення">Статус замовлення</button>
      <button type="button" class="chip-suggest shrink-0" data-chat-preset="Які умови доставки?">Доставка</button>
      <button type="button" class="chip-suggest shrink-0" data-chat-preset="Потрібен рахунок для клініки">Рахунок для клініки</button>
      <button type="button" class="chip-suggest shrink-0" data-chat-preset="Чи є знижки для постійних клієнтів?">Знижки</button>
      <button type="button" class="chip-suggest shrink-0" data-chat-preset="Допоможіть підібрати аналог">Підбір аналога</button>
    </div>

    <!-- Введення -->
    <form class="flex items-center gap-2 border-t border-ink-100 px-4 py-3" data-chat-form>
      <label for="chat-input" class="sr-only">Повідомлення</label>
      <input
        id="chat-input"
        name="message"
        autocomplete="off"
        placeholder="Напишіть повідомлення…"
        class="field h-11 flex-1 rounded-full py-0 text-[15px]"
        data-chat-input
      />
      <button type="submit" class="grid h-11 w-11 shrink-0 place-items-center rounded-full bg-brand-600 text-white transition-all duration-250 hover:bg-brand-700 active:scale-95" aria-label="Надіслати">
        <svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <path d="M4.5 12h14m0 0-5.5-5.5M18.5 12 13 17.5" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </button>
    </form>

    <p class="border-t border-ink-100 bg-white px-4 pb-3 pt-2.5 text-center text-[11px] text-ink-400">
      Також доступні
      <a href="https://t.me/socoukraine" target="_blank" rel="noopener noreferrer" class="font-medium text-brand-600 hover:underline">Telegram</a>
      и
      <a href="viber://chat?number=%2B380674011590" class="font-medium text-brand-600 hover:underline">Viber</a>
    </p>
  </section>

  <!-- Кнопка чату -->
  <button
    type="button"
    class="group relative grid h-14 w-14 place-items-center rounded-full bg-brand-600 text-white shadow-brand transition-all duration-350 hover:scale-105 hover:bg-brand-700 active:scale-95"
    data-chat-toggle
    aria-label="Відкрити онлайн-чат"
    aria-expanded="false"
  >
    <span class="absolute inset-0 animate-pulse-ring rounded-full bg-brand-500/50" aria-hidden="true"></span>
    <svg viewBox="0 0 24 24" class="relative h-6 w-6 transition-transform duration-350 group-data-[open]:rotate-90 group-data-[open]:scale-0" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true" data-chat-icon-open>
      <path d="M20 12a7.5 7.5 0 0 1-11 6.6L4.5 20l1.4-4.4A7.5 7.5 0 1 1 20 12Z" stroke-linejoin="round" />
      <path d="M9 11h6M9 14h4" stroke-linecap="round" />
    </svg>
    <svg viewBox="0 0 24 24" class="absolute h-6 w-6 rotate-90 scale-0 transition-transform duration-350 group-data-[open]:rotate-0 group-data-[open]:scale-100" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
      <path d="m6 6 12 12M18 6 6 18" stroke-linecap="round" />
    </svg>
    <span
      class="absolute -right-0.5 -top-0.5 grid h-5 w-5 place-items-center rounded-full bg-rose-500 text-[10px] font-bold text-white ring-2 ring-white transition-transform duration-300"
      data-chat-badge
      >1</span
    >
  </button>
</div>
