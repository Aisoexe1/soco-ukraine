<section class="container-x py-8 lg:py-12">
  <nav aria-label="Хлібні крихти" class="mb-6">
    <ol class="flex flex-wrap items-center gap-2 text-[13px] text-ink-500">
      <li><a href="index.html" class="transition-colors hover:text-brand-700">Головна</a></li>
      <li aria-hidden="true" class="text-ink-300">/</li>
      <li><span class="font-medium text-ink-900">Обране</span></li>
    </ol>
  </nav>

  <div class="flex flex-wrap items-end justify-between gap-4">
    <div>
      <h1 class="text-3xl font-semibold tracking-tight text-ink-900 sm:text-4xl">Обране</h1>
      <p class="mt-3 text-[15px] text-ink-500" data-fav-sub>Товари, які ви відклали на потім.</p>
    </div>
    <div class="flex gap-2" data-fav-actions>
      <button type="button" class="btn-primary" data-fav-add-all>
        <svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M3 4h2.2l2 11.2a2 2 0 0 0 2 1.6h7.9a2 2 0 0 0 2-1.5L20.5 8H6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        Усе в кошик
      </button>
      <button type="button" class="btn-secondary" data-fav-clear>Очистити</button>
    </div>
  </div>

  <div class="mt-10 grid gap-4 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4" data-fav-grid></div>

  <!-- Порожньо -->
  <div class="hidden py-16 text-center" data-fav-empty>
    <span class="mx-auto mb-6 grid h-24 w-24 place-items-center rounded-[2rem] bg-ink-50 text-ink-300">
      <svg viewBox="0 0 24 24" class="h-12 w-12" fill="none" stroke="currentColor" stroke-width="1.3" aria-hidden="true">
        <path d="M12 20.5s-7.5-4.7-7.5-10A4.2 4.2 0 0 1 12 7.6a4.2 4.2 0 0 1 7.5 2.9c0 5.3-7.5 10-7.5 10Z" stroke-linejoin="round" />
      </svg>
    </span>
    <h2 class="text-2xl font-semibold text-ink-900">В обраному порожньо</h2>
    <p class="mx-auto mt-3 max-w-md text-[15px] leading-relaxed text-ink-500">
      Натискайте на сердечко в каталозі, щоб зберегти товар і швидко знайти його потім.
    </p>
    <a href="catalog.html" class="btn-primary btn-lg mt-8">Перейти до каталогу</a>
  </div>
</section>
