<!doctype html>
<html lang="{{LANG}}" class="scroll-smooth"{{THEME_ATTR}}>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    {{THEME_META}}
    <meta name="color-scheme" content="{{COLOR_SCHEME}}" />

    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <meta name="keywords" content="{{KEYWORDS}}" />
    <meta name="robots" content="{{ROBOTS}}" />
    <meta name="author" content="{{SITE_NAME}}" />
    <link rel="canonical" href="{{CANONICAL}}" />

    <!-- Open Graph -->
    <meta property="og:type" content="{{OG_TYPE}}" />
    <meta property="og:site_name" content="{{SITE_NAME}}" />
    <meta property="og:locale" content="{{OG_LOCALE}}" />
    <meta property="og:locale:alternate" content="ru_UA" />
    <meta property="og:title" content="{{TITLE}}" />
    <meta property="og:description" content="{{DESCRIPTION}}" />
    <meta property="og:url" content="{{CANONICAL}}" />
    <meta property="og:image" content="{{OG_IMAGE}}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="{{SITE_NAME}} — стоматологічні матеріали та обладнання" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{TITLE}}" />
    <meta name="twitter:description" content="{{DESCRIPTION}}" />
    <meta name="twitter:image" content="{{OG_IMAGE}}" />

    <!-- Іконки -->
    <link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="site.webmanifest" />

    <!-- Шрифти (self-hosted, без сторонніх запитів) -->
    <link rel="preload" href="assets/fonts/inter-cyrillic.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />{{PRELOAD}}
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/style.css" />
    <!--
      Базовий URL CRM API. Залиште порожнім, коли вітрина та CRM працюють
      на одному домені; інакше задайте URL CRM під час розгортання.
    -->
    <meta name="soco-crm-api-url" content="{{CRM_API_URL}}" />

    <script type="application/ld+json">{{JSONLD}}</script>
  </head>

  <body class="{{BODY_CLASS}} min-h-screen bg-white">
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[100] focus:rounded-full focus:bg-brand-600 focus:px-5 focus:py-3 focus:text-sm focus:font-medium focus:text-white"
      >Перейти до вмісту</a
    >

    <!-- @include header -->

    <main id="main">
      {{BODY}}
    </main>

    <!-- @include footer -->
    <!-- @include search-overlay -->
    <!-- @include chat -->
    <!-- @include toast -->

    <script src="assets/js/data.js" defer></script>
    <script src="assets/js/app.js" defer></script>{{PAGE_SCRIPT}}
  </body>
</html>
